server:
  port: 8081

spring:
  # Virtual threads (Java 21 + Spring Boot 3.2+): cada conexão SSE de longa duração
  # deixa de prender uma platform thread do Tomcat enquanto está ociosa — a virtual
  # thread é desmontada do carrier durante o I/O. Resolve o custo de ~N threads
  # presas a conexões SSE quietas, sem migrar para o modelo reativo (WebFlux).
  threads:
    virtual:
      enabled: true
  artemis:
    broker-url: tcp://localhost:61616
    user: artemis
    password: artemis123
  jms:
    pub-sub-domain: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fila-atendimento
          jwk-set-uri: http://localhost:8080/realms/fila-atendimento/protocol/openid-connect/certs

logging:
  level:
    root: WARN
    com.fila.apipainel.service.PainelSseService: ERROR
    org.apache.catalina.connector.CoyoteOutputStream: OFF
    org.apache.catalina.connector.CoyoteAdapter: OFF
    org.apache.catalina.core: OFF
    org.apache.coyote.http11.Http11Processor: OFF
    org.springframework.web.servlet.mvc.method.annotation.SseEmitter: OFF
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: OFF
