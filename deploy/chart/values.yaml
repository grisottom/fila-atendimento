# Valores do ambiente local (k3d). Credenciais abaixo são apenas de desenvolvimento.

# URL pública (navegador -> gateway do k3d). O browser resolve *.localtest.me para 127.0.0.1.
exposure:
  scheme: https
  port: "9443"
  className: traefik
  hosts:
    painel: fila-painel.apps.localtest.me
    atendimento: fila-atendimento.apps.localtest.me

# Imagens construídas pela pipeline Tekton (monorepo => uma única tag, o hash do commit).
# ATENÇÃO: a pipeline atualiza a linha "tag:" abaixo via sed. Mantenha UMA única chave "tag:" neste arquivo.
image:
  registry: k3d-my-registry:5000/amq
  tag: "latest"
  pullPolicy: IfNotPresent

apiAtendimento:
  replicas: 1
  image: fila-api-atendimento
  port: 8082
  # Em produção a chamada é recusada sem painel ativo; mantenha true.
  exigirPainelAtivo: "true"
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

apiPainel:
  replicas: 1
  image: fila-api-painel
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

appAtendimento:
  replicas: 1
  image: fila-app-atendimento
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

appPainel:
  replicas: 1
  image: fila-app-painel
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

postgres:
  image: postgres:16-alpine
  database: fila_atendimento
  username: fila
  password: fila123
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# Broker gerenciado pelo ActiveMQ Artemis Operator (CR ActiveMQArtemis, broker.amq.io).
# Requer o operador instalado no cluster.
artemis:
  username: artemis
  password: artemis123
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

# IdP OAuth2/OIDC EXTERNO (a aplicação não implanta Keycloak). Os apps são SPAs (client público,
# Authorization Code + PKCE): não há client secret. O dono do IdP fornece issuer, client_ids
# (fila-painel, fila-atendimento), redirect URIs/web origins dos hosts acima e, se for CA privada, a CA.
# issuerUri deve ser IDÊNTICO ao "iss" do token (comparado como texto), igual dentro e fora do cluster.
oidc:
  issuerUri: https://sso.apps.localtest.me:9443/realms/fila-atendimento
  jwkSetUri: https://sso.apps.localtest.me:9443/realms/fila-atendimento/protocol/openid-connect/certs
  # Nome de um ConfigMap (chave ca.crt, um ou mais certificados PEM) com a CA do IdP, no namespace
  # da aplicação. Vazio = usa só as CAs padrão da JVM. Quando informado, um initContainer gera o
  # truststore (cacerts da JVM + essa CA) usado pelas APIs.
  caConfigMap: idp-ca-bundle
