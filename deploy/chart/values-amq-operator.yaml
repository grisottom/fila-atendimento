# Overrides do exemplo fila-atendimento-AMQ-Operator (aplicado DEPOIS de values.yaml).
# Roda em paralelo ao exemplo padrão: hosts e imagens próprios.
# NÃO coloque uma chave "tag:" aqui: a pipeline atualiza a tag só em values.yaml.

exposure:
  hosts:
    painel: fila-amq-painel.apps.localtest.me
    atendimento: fila-amq-atendimento.apps.localtest.me
    keycloak: fila-amq-keycloak.apps.localtest.me

# Os frontends embutem a URL do Keycloak no build; um caminho próprio no registry evita
# que as imagens deste exemplo sobrescrevam as do exemplo padrão (mesmo hash de commit).
image:
  registry: k3d-my-registry:5000/amq

artemis:
  operator:
    enabled: true
