apiVersion: v1
kind: Secret
metadata:
  name: fila-credentials
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-credentials") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  ARTEMIS_USER: {{ .Values.artemis.username | quote }}
  ARTEMIS_PASSWORD: {{ .Values.artemis.password | quote }}
