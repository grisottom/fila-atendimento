{{- if not .Values.artemis.operator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: fila-artemis
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-artemis") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: fila-artemis
  ports:
    - name: core
      port: 61616
      targetPort: 61616
    - name: console
      port: 8161
      targetPort: 8161
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fila-artemis
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-artemis") | nindent 4 }}
spec:
  serviceName: fila-artemis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fila-artemis
  template:
    metadata:
      labels:
        {{- include "fila.labels" (dict "root" . "name" "fila-artemis") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: artemis
          image: {{ .Values.artemis.image }}
          env:
            - name: ARTEMIS_USER
              valueFrom: { secretKeyRef: { name: fila-credentials, key: ARTEMIS_USER } }
            - name: ARTEMIS_PASSWORD
              valueFrom: { secretKeyRef: { name: fila-credentials, key: ARTEMIS_PASSWORD } }
            - name: ANONYMOUS_LOGIN
              value: "false"
          ports:
            - containerPort: 61616
            - containerPort: 8161
          readinessProbe:
            tcpSocket:
              port: 61616
            periodSeconds: 5
            failureThreshold: 20
          resources:
            {{- toYaml .Values.artemis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/artemis-instance
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.artemis.storage }}
{{- end }}
