{{- /*
Broker gerenciado pelo ActiveMQ Artemis Operator (arkmq-org / AMQ Broker, API broker.amq.io).
Requer o operador instalado no cluster. O operador cria o StatefulSet "fila-artemis-ss", o PVC e
os Services "fila-artemis-*-svc". A configuração padrão gerada pelo operador já tem o que as APIs
usam: DLQ como dead-letter, auto-create de filas/endereços e wildcards (agencia.*.painel.*).
*/}}
apiVersion: broker.amq.io/v1beta1
kind: ActiveMQArtemis
metadata:
  name: fila-artemis
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-artemis") | nindent 4 }}
spec:
  adminUser: {{ .Values.artemis.username | quote }}
  adminPassword: {{ .Values.artemis.password | quote }}
  deploymentPlan:
    size: 1
    persistenceEnabled: true
    # exige usuário e senha (sem login anônimo)
    requireLogin: true
    extraMounts:
      configMaps:
        - fila-artemis-jolokia
    storage:
      size: {{ .Values.artemis.storage }}
    resources:
      {{- toYaml .Values.artemis.resources | nindent 6 }}
  acceptors:
    - name: all
      port: 61616
      protocols: all
      # Sem isso o acceptor escuta só no hostname do pod; 0.0.0.0 evita depender
      # de como o ztunnel (Istio ambient) entrega o tráfego ao pod.
      bindToAllInterfaces: true
  console:
    expose: false
  # O console (hawtio/Jolokia) só aceita origens listadas no jolokia-access.xml e recusa Origin https
  # quando chega por HTTP (TLS termina no gateway). Sem isso a tela do console abre vazia.
  env:
    - name: JAVA_ARGS_APPEND
      value: "-Djolokia.policyLocation=file:/amq/extra/configmaps/fila-artemis-jolokia/jolokia-access.xml"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fila-artemis-jolokia
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-artemis") | nindent 4 }}
data:
  jolokia-access.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <restrict>
      <cors>
        <allow-origin>*://{{ .Values.exposure.hosts.artemis }}*</allow-origin>
        <allow-origin>*://fila-artemis-ss-0.fila-artemis-hdls-svc.{{ .Release.Namespace }}.svc.cluster.local*</allow-origin>
        <ignore-scheme/>
        <strict-checking/>
      </cors>
    </restrict>
---
# Endereço estável que as APIs usam (tcp://fila-artemis:61616), apontando para o pod do operador
apiVersion: v1
kind: Service
metadata:
  name: fila-artemis
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-artemis") | nindent 4 }}
spec:
  selector:
    ActiveMQArtemis: fila-artemis
    application: fila-artemis-app
  ports:
    - name: core
      port: 61616
      targetPort: 61616
