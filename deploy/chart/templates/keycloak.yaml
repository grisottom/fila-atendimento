{{- /* Realm: reaproveita files/realm-export.json trocando redirectUris/webOrigins pelas URLs públicas do cluster */ -}}
{{- $realm := .Files.Get "files/realm-export.json" | fromJson }}
{{- range $client := $realm.clients }}
  {{- $host := "" }}
  {{- if eq $client.clientId "fila-painel" }}{{ $host = $.Values.exposure.hosts.painel }}{{ end }}
  {{- if eq $client.clientId "fila-atendimento" }}{{ $host = $.Values.exposure.hosts.atendimento }}{{ end }}
  {{- if $host }}
    {{- $origin := include "fila.url" (dict "root" $ "host" $host) }}
    {{- $_ := set $client "redirectUris" (list (printf "%s/*" $origin)) }}
    {{- $_ := set $client "webOrigins" (list $origin) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fila-keycloak-realm
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-keycloak") | nindent 4 }}
data:
  realm-export.json: |
    {{- $realm | toPrettyJson | nindent 4 }}
{{- range $theme := list "painel" "atendimento" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fila-keycloak-theme-{{ $theme }}
  labels:
    {{- include "fila.labels" (dict "root" $ "name" "fila-keycloak") | nindent 4 }}
data:
  {{- range $file := list "theme.properties" "messages_pt_BR.properties" "messages_en.properties" }}
  {{ $file }}: |
    {{- $.Files.Get (printf "files/themes/%s/%s" $theme $file) | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: fila-keycloak
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-keycloak") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: fila-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fila-keycloak
  labels:
    {{- include "fila.labels" (dict "root" . "name" "fila-keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fila-keycloak
  template:
    metadata:
      labels:
        {{- include "fila.labels" (dict "root" . "name" "fila-keycloak") | nindent 8 }}
      annotations:
        # reinicia o pod se o realm mudar
        checksum/realm: {{ $realm | toJson | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: { secretKeyRef: { name: fila-credentials, key: KEYCLOAK_ADMIN } }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: fila-credentials, key: KEYCLOAK_ADMIN_PASSWORD } }
            # URL pública: é o "iss" dos tokens e a base das redirecionamentos do navegador
            - name: KC_HOSTNAME_URL
              value: {{ include "fila.keycloakUrl" . | quote }}
            - name: KC_HOSTNAME_ADMIN_URL
              value: {{ include "fila.keycloakUrl" . | quote }}
            # TLS termina no gateway/ingress
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms512m -Xmx1024m"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: theme-painel
              mountPath: /opt/keycloak/themes/painel/login
              readOnly: true
            - name: theme-atendimento
              mountPath: /opt/keycloak/themes/atendimento/login
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: fila-keycloak-realm
        {{- range $theme := list "painel" "atendimento" }}
        - name: theme-{{ $theme }}
          configMap:
            name: fila-keycloak-theme-{{ $theme }}
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: messages_pt_BR.properties, path: messages/messages_pt_BR.properties }
              - { key: messages_en.properties, path: messages/messages_en.properties }
        {{- end }}
