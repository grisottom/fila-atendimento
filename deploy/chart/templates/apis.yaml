{{- /* api-atendimento e api-painel: mesmo formato, mudam porta, imagem e variáveis */ -}}
{{- range $api := list "apiAtendimento" "apiPainel" }}
{{- $v := index $.Values $api }}
{{- $name := ternary "fila-api-atendimento" "fila-api-painel" (eq $api "apiAtendimento") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "fila.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: {{ $v.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "fila.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "fila.labels" (dict "root" $ "name" $name) | nindent 8 }}
    spec:
      {{- if $.Values.oidc.caConfigMap }}
      initContainers:
        # Gera o truststore da JVM: cacerts padrão + CA(s) do IdP (ConfigMap com ca.crt)
        - name: idp-truststore
          image: {{ include "fila.image" (dict "root" $ "name" $v.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts
              chmod u+w /truststore/cacerts
              cd /tmp
              awk '/BEGIN CERTIFICATE/{n++} n{print > ("idp-" n ".crt")}' /idp-ca/ca.crt
              for f in idp-*.crt; do
                keytool -importcert -noprompt -trustcacerts -alias "$f" -file "$f" \
                  -keystore /truststore/cacerts -storepass changeit
              done
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: idp-ca, mountPath: /idp-ca, readOnly: true }
            - { name: truststore, mountPath: /truststore }
      {{- end }}
      containers:
        - name: app
          image: {{ include "fila.image" (dict "root" $ "name" $v.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70{{ if $.Values.oidc.caConfigMap }} -Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit{{ end }}"
            - name: SPRING_ARTEMIS_BROKER_URL
              value: tcp://fila-artemis:61616
            - name: SPRING_ARTEMIS_USER
              valueFrom: { secretKeyRef: { name: fila-credentials, key: ARTEMIS_USER } }
            - name: SPRING_ARTEMIS_PASSWORD
              valueFrom: { secretKeyRef: { name: fila-credentials, key: ARTEMIS_PASSWORD } }
            # IdP externo: "iss" e JWKS pela URL pública (HTTPS), idêntica dentro e fora do cluster
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ $.Values.oidc.issuerUri | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: {{ $.Values.oidc.jwkSetUri | quote }}
            {{- if eq $api "apiAtendimento" }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://fila-postgres:5432/{{ $.Values.postgres.database }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: fila-credentials, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: fila-credentials, key: POSTGRES_PASSWORD } }
            - name: ATENDIMENTO_EXIGIR_PAINEL_ATIVO
              value: {{ $v.exigirPainelAtivo | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $v.port }}
          startupProbe:
            tcpSocket:
              port: {{ $v.port }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: {{ $v.port }}
            periodSeconds: 10
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- if $.Values.oidc.caConfigMap }}
          volumeMounts:
            - { name: truststore, mountPath: /truststore, readOnly: true }
          {{- end }}
      {{- if $.Values.oidc.caConfigMap }}
      volumes:
        - name: idp-ca
          configMap:
            name: {{ $.Values.oidc.caConfigMap }}
        - name: truststore
          emptyDir: {}
      {{- end }}
---
{{- end }}
